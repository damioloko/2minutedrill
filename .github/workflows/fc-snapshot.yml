name: Nightly market update

on:
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC every day
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write
  pages: write

concurrency:
  group: market-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # crawler state (league list, seen trades) stays private in the Actions cache
      - name: Restore crawler state
        uses: actions/cache/restore@v4
        with:
          path: .crawl-state
          key: crawl-state-${{ github.run_id }}
          restore-keys: crawl-state-

      - name: Save today's values
        run: node scripts/fc-snapshot.mjs

      - name: Collect market trades
        continue-on-error: true
        run: node scripts/trades-crawl.mjs

      - name: Save crawler state
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .crawl-state
          key: crawl-state-${{ github.run_id }}

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fc
          git diff --cached --quiet && exit 0
          git commit -m "Market update $(date -u +%F)"
          git push

      - name: Rebuild GitHub Pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
